<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>GPU资产巡检报告</title>

    <style>
        body { background: #f0f2f5; padding: 20px; }
        .card { border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .status-ok { color: #52c41a; }
        .status-warn { color: #faad14; }
        .status-error { color: #ff4d4f; }
        .status-na { color: #8c8c8c; }
        .score-circle { font-size: 48px; font-weight: 700; }
        .kv-list dt { width: 200px; color: #595959; font-weight: 500; }
        .kv-list dd { margin-left: 220px; color: #262626; }
    </style>
</head>
<body>

                    </div>
                </div>
            </div>
        </div>
        <!-- 以下为动态内容区域 -->
        <div id="content"></div>
    </div>

    <!-- ====== 由 generate_report.py 注入的数据 ====== -->

    <script>
    // 用JavaScript动态填充数据
    document.getElementById('report_time').textContent = new Date().toLocaleString();

    function safe(v) { return (v === null || v === undefined || v === 'N/A' || v === '[N/A]') ? 'N/A' : v; }
    function statusClass(level) {
        return { ok: 'status-ok', warn: 'status-warn', error: 'status-error', na: 'status-na' }[level] || 'status-na';
    }

    function renderBasicInfo() {
        var gpus = REPORT_DATA.gpus || [];
        var detail = REPORT_DATA.detail || {};
        var html = '<div class="card"><div class="card-body">'
                 + '<h2 class="h4">GPU 基本信息</h2>'
                 + '<table class="table table-bordered align-middle">'
                 + '<thead class="table-light"><tr>'
                 + '<th>#</th><th>型号</th><th>UUID</th><th>显存总量</th><th>驱动版本</th><th>CUDA 版本</th>'
                 + '<th>PCIe 代数</th><th>Link Width</th><th>P-State</th>'
                 + '</tr></thead><tbody>';
        if (gpus.length === 0) {
            html += '<tr><td colspan="9" class="text-center text-muted">无 GPU 信息</td></tr>';
        }
        gpus.forEach(function(g, i) {
            html += '<tr>'
                  + '<td>' + i + '</td>'
                  + '<td>' + safe(g.name) + '</td>'
                  + '<td><code>' + safe(g.uuid) + '</code></td>'
                  + '<td>' + safe(g['memory.total']) + '</td>'
                  + '<td>' + safe(detail.driver_version) + '</td>'
                  + '<td>' + safe(detail.cuda_version) + '</td>'
                  + '<td>' + safe(detail.pcie_generation) + '</td>'
                  + '<td>' + safe(detail.link_width) + '</td>'
                  + '<td>' + safe(detail.performance_state) + '</td>'
                  + '</tr>';
        });
        html += '</tbody></table>';

        // 显存使用详情
        var fb = detail.fb_memory_usage || {};
        if (fb.total || fb.used || fb.free) {
            html += '<h3 class="h6 mt-3">显存使用 (FB Memory Usage)</h3>'
                  + '<dl class="kv-list row">'
                  + '<dt>Total</dt><dd>' + safe(fb.total) + '</dd>'
                  + '<dt>Used</dt><dd>' + safe(fb.used) + '</dd>'
                  + '<dt>Free</dt><dd>' + safe(fb.free) + '</dd>'
                  + '</dl>';
        }
        html += '</div></div>';
        return html;
    }

    function renderHealth() {
        var health = REPORT_DATA.health || {};
        var score = health.score;
        var checks = health.checks || [];

        var scoreColor = score >= 90 ? '#52c41a' : score >= 70 ? '#faad14' : '#ff4d4f';
        var html = '<div class="card"><div class="card-body">'
                 + '<h2 class="h4">健康检查</h2>'
                 + '<div class="d-flex align-items-center mb-3">'
                 + '<div class="score-circle me-4" style="color:' + scoreColor + '">' + (score === null || score === undefined ? 'N/A' : score) + '</div>'
                 + '<div class="text-muted">健康评分 (0-100)</div>'
                 + '</div>';

        if (checks.length === 0) {
            html += '<p class="text-muted">无检查项</p>';
        } else {
            html += '<ul class="list-group">';
            checks.forEach(function(c) {
                html += '<li class="list-group-item d-flex justify-content-between align-items-center">'
                      + '<span>' + c.msg + '</span>'
                      + '<span class="' + statusClass(c.level) + '"><strong>' + c.level.toUpperCase() + '</strong></span>'
                      + '</li>';
            });
            html += '</ul>';
        }
        html += '</div></div>';
        return html;
    }

    // 用ECharts绘制拓扑图
    // 多卡拓扑图的核心是显示GPU之间的连接关系，ECharts的关系图（graph）可以很好地展示
    function initTopologyChart(domId, topoData) {
        var chart = echarts.init(document.getElementById(domId));

        if (!topoData || !topoData.matrix) {
            document.getElementById(domId).innerHTML = '<div class="text-muted p-4 text-center">无拓扑数据</div>';
            return;
        }

        // 构建节点（GPU）
        var nodes = [];
        var links = [];
        var gpuNames = Object.keys(topoData.matrix);

        gpuNames.forEach(function(name, idx) {
            nodes.push({
                id: name,
                name: name,
                symbolSize: 50,
                itemStyle: { color: '#1890ff' }
            });
        });

        // 构建连线（根据拓扑矩阵）
        // 示例：如果矩阵中显示NV1，则连一条粗线
        // topoData中的值：'X'=自身, 'NV#'=NVLink, 'PIX'=PCIe桥接, 'SYS'=跨NUMA
        var linkStyle = {
            'NV':    { color: '#722ed1', width: 4, label: 'NVLink' },
            'PIX':   { color: '#13c2c2', width: 3, label: 'PIX' },
            'PXB':   { color: '#1890ff', width: 2, label: 'PXB' },
            'SYS':   { color: '#fa8c16', width: 2, label: 'SYS' },
            'PHB':   { color: '#8c8c8c', width: 1, label: 'PHB' },
        };

        gpuNames.forEach(function(src) {
            var conns = topoData.matrix[src].connections;
            gpuNames.forEach(function(dst) {
                if (src === dst) return; // 跳过对角线
                var cell = conns[dst];
                if (!cell || cell === 'N/A' || cell === 'X') return;
                // 归类：NV12 -> NV
                var prefix = cell.match(/^[A-Za-z]+/);
                var key = prefix ? prefix[0] : cell;
                var style = linkStyle[key] || { color: '#8c8c8c', width: 1, label: cell };
                links.push({
                    source: src,
                    target: dst,
                    value: style.label + ' (' + cell + ')',
                    lineStyle: { color: style.color, width: style.width, curveness: 0.2 }
                });
            });
        });

        var option = {
            title: { text: 'GPU互联拓扑' },
            series: [{
                type: 'graph',
                layout: 'force',
                data: nodes,
                links: links,
                roam: true,
                label: { show: true, position: 'right' },
                lineStyle: { color: 'source', curveness: 0.3 },
                force: { repulsion: 200, edgeLength: [80, 200] }
            }]
        };

        chart.setOption(option);
        window.addEventListener('resize', function() { chart.resize(); });
    }

    function renderTopology() {
        var html = '<div class="card"><div class="card-body">'
                 + '<h2 class="h4">GPU 互联拓扑</h2>'
                 + '<div id="topology_chart" style="height:420px;"></div>'
                 + '</div></div>';
        setTimeout(function() {
            if (typeof initTopologyChart === 'function' && REPORT_DATA.topology) {
                initTopologyChart('topology_chart', REPORT_DATA.topology);
            }
        }, 100);
        return html;
    }

    // 系统信息 + PCIe 设备
    function renderSystem() {
        var sys = REPORT_DATA.system || {};
        var html = '<div class="card"><div class="card-body">'
                 + '<h2 class="h4">系统信息</h2>'
                 + '<dl class="kv-list">'
                 + '<dt>uname / OS</dt><dd><pre class="mb-0">' + safe(sys.kernel) + '</pre></dd>'
                 + '<dt>PCIe 设备</dt><dd><pre class="mb-0">' + safe(sys.pci_devices) + '</pre></dd>'
                 + '<dt>ECC 错误</dt><dd><pre class="mb-0">' + safe(sys.ecc) + '</pre></dd>'
                 + '</dl></div></div>';
        return html;
    }

    // 渲染全部内容
    (function() {
        var content = document.getElementById('content');
        var parts = [];
        parts.push(renderBasicInfo());
        parts.push(renderHealth());
        parts.push(renderTopology());
        parts.push(renderSystem());
        content.innerHTML = parts.join('');
    })();
    </script>
</body>
